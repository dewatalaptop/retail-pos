name: Build Android APK

# Manual trigger only — an unrelated commit to the web app shouldn't burn
# CI minutes rebuilding the Android wrapper every time. Fire it from the
# AI App Builder dashboard's "Generate Android" button, or manually via
# Actions > Build Android APK > Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write # needed to publish the APK to a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Capacitor 8's Android Gradle Plugin requires JDK 21 (confirmed via a
      # real CI failure with 17: "invalid source release: 21") — bump this
      # if a future Capacitor major version changes the requirement again.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - run: npm ci

      - run: npm run build

      # capacitor.config.json points at the app's own live URL (server.url) —
      # this app is a thin native shell around the already-deployed web app,
      # not a rebuilt offline copy, so this just re-syncs config/plugins.
      - run: npx cap sync android

      # Native Google Sign-In needs a stable SHA-1 fingerprint registered with
      # the app's Firebase Android app config — a debug keystore Gradle
      # auto-generates on first use would get a NEW random SHA-1 on every
      # ephemeral CI runner, breaking sign-in every single build. Generate it
      # once and commit it, so every future run (and every future project
      # that copies this workflow) reuses the exact same identity. Uses the
      # same well-known alias/password Android tooling itself defaults to
      # (androiddebugkey / android), so nothing else needs to reference it —
      # Gradle's default debug signing config picks up ~/.android/debug.keystore
      # automatically as long as it's there before the build runs.
      - name: Ensure a stable debug keystore exists
        run: |
          mkdir -p ~/.android
          if [ -f android/debug.keystore ]; then
            cp android/debug.keystore ~/.android/debug.keystore
          else
            keytool -genkeypair -v -keystore android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            cp android/debug.keystore ~/.android/debug.keystore
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add android/debug.keystore
            git commit -m "Add stable debug keystore for reproducible Android sign-in"
            git push
          fi
          echo "SHA-1 fingerprint (register this with any OAuth client that needs it):"
          keytool -list -v -keystore android/debug.keystore -storepass android -alias androiddebugkey | grep "SHA1:"

      - name: Build debug APK
        working-directory: frontend/android
        # gradlew's executable bit doesn't survive a commit made from a
        # Windows checkout (Git for Windows doesn't track the Unix mode bit
        # the same way), so it silently loses +x — chmod it explicitly
        # rather than relying on git to have preserved it.
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      # Debug-signed (Android's default debug keystore, baked into the
      # Android SDK) — installable/sideloadable immediately with no keystore
      # secret to manage, which is all "download and try the APK" needs.
      - name: Publish APK to a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android build (run ${{ github.run_number }})
          body: Debug-signed APK, auto-published by the Build Android APK workflow. Not for Play Store distribution.
          files: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
